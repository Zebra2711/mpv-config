####------Script settings-----####

#--auto for automatic device detection, or manually change to: Windows or Mac or Linux
device=auto

#--Set the copy command used in Linux. Or write a different command
linux_copy=xclip -silent -selection clipboard -in

#--Set the paste command used in Linux. Or write a different command
linux_paste=xclip -selection clipboard -o

#--Set the copy command used on Mac. Or write a different command
mac_copy=pbcopy

#--Set the paste command used on Mac. Or write a different command
mac_paste=pbpaste

#--Specify Powershell to use for copying in Windows. Or write a copy command, for example: clip
windows_copy=powershell

#--Specify Powershell to use for pasting in Windows. Or write a paste command
windows_paste=powershell

#--Autorun list when mpv is opened and no video/file is loaded. 'none' means disabled. Or choose: all, copy, paste, recents, distinct, protocols, fileonly, titleonly, timeonly, keywords
auto_run_list_idle=none

#--Hide osc-idle-screen messages when opening and closing menus (may cause unexpected behavior if multiple scripts trigger osc-idle-screen closing)
toggle_idlescreen=no

#--Change to 0 so that items are restored from the exact location, or decrease the value to give you some preview before loading the restore point
resume_offset=-1

#--yes is used to display OSD messages when operations occur. Changing to no will disable all osd messages generated from this script
osd_messages=yes

#--yes is used to mark cut times as chapters. no disables the behavior of marking chapters
mark_clipboard_as_chapter=no

#--Set options for copying time when using video. Select: local, protocols, specifics, all, none. 
##'none' means disable, 'all' means copy time for all videos, 'protocols' means copy time only for all protocol videos, 'specifics' means copy time only for videos in the websites defined below, 'local' means copy time only for non-protocol videos
copy_time_method=all

#--Specifies paste behavior when any valid content is copied and no video is running. Selection range: force, force-noresume
log_paste_idle_behavior=force-noresume

#--Specifies paste behavior when any valid content is copied and a video is running. Selection range: timestamp>playlist, timestamp>force, timestamp, playlist, force, force-noresume
log_paste_running_behavior=timestamp>playlist

#--The time attribute that will be added when copying a protocol for a specific site from this list. Additional attributes can be added following the same format
specific_time_attributes=[ ["twitter", "?t=", ""], ["twitch", "?t=", "s"], ["youtube", "&t=", "s"] ]

#--Specify the text that will be copied before the jump time when copying protocol videos from mpv
protocols_time_attribute=&t=

#--Specify the text that will be copied before the jump time when copying local videos from mpv
local_time_attribute=&time=

#--Automatically add resume, specific_time_attributes, protocols_time_attribute, local_time_attribute time attributes that can be pasted
pastable_time_attributes=[" | time="]

#--Specify key binding for copying
##! Note: This binding will override the same key position in input.conf. It is recommended to leave it blank and bind this function in input.conf
copy_keybind=[""]

#--The priority of paste behavior when a video is running. Choose from: playlist, timestamp, force
running_paste_behavior=playlist

#--Specify key binding for pasting
##! Note: This binding will override the same key position in input.conf. It is recommended to leave it blank and bind this function in input.conf
paste_keybind=[""]

#--Paste behavior when using paste_specific_keybind. Select: title, path, timestamp, path&timestamp
copy_specific_behavior=path

#--The key binding that will be used for copying according to the specified copy behavior
##! Note: This binding will override the same key position in input.conf. It is recommended to leave it blank and bind this function in input.conf
copy_specific_keybind=[""]

#--Paste behavior when using paste_specific_keybind. Choose from: playlist, timestamp, force
paste_specific_behavior=playlist

#--The key binding that will be used for pasting according to the specified paste behavior
##! Note: This binding will override the same key position in input.conf. It is recommended to leave it blank and bind this function in input.conf
paste_specific_keybind=[""]

#--Add below (after the comma) any protocol you wish to paste; for example: ,'ftp://'. Or set it to "" to make paste work for any protocol by removing all defined protocols
paste_protocols=["://", "magnet:"]

#--Add below (after the comma) any extension you wish to paste; for example: ,'pdf'. Or set it to "" to make paste work for any extension by removing all defined extensions
paste_extensions=["ac3", "a52", "eac3", "mlp", "dts", "dts-hd", "dtshd", "yes-hd", "thd", "yeshd", "thd+ac3", "tta", "pcm", "wav", "aiff", "aif", "aifc", "amr", "awb", "au", "snd", "lpcm", "yuv", "y4m", "ape", "wv", "shn", "m2ts", "m2t", "mts", "mtv", "ts", "tsv", "tsa", "tts", "trp", "adts", "adt", "mpa", "m1a", "m2a", "mp1", "mp2", "mp3", "mpeg", "mpg", "mpe", "mpeg2", "m1v", "m2v", "mp2v", "mpv", "mpv2", "mod", "tod", "vob", "vro", "evob", "evo", "mpeg4", "m4v", "mp4", "mp4v", "mpg4", "m4a", "aac", "h264", "avc", "x264", "264", "hevc", "h265", "x265", "265", "flac", "oga", "ogg", "opus", "spx", "ogv", "ogm", "ogx", "mkv", "mk3d", "mka", "webm", "we禁止
#--Add below (after the comma) any extension you wish to paste to try adding as a subtitle file; for example: ,'txt'. Or set it to "" to make paste attempt to add any subtitles
paste_subtitles=["aqt", "gsub", "jss", "sub", "ttxt", "pjs", "psb", "rt", "smi", "slt", "ssf", "srt", "ssa", "ass", "usf", "idx", "vtt"]

#--Key binding that will be used to open the list with the specified filter. Available filters: "all", "copy", "paste", "recents", "distinct", "protocols", "fileonly", "titleonly", "timeonly", "keywords"
##! Note: This binding will override the same key position in input.conf. It is recommended to leave it blank and bind this function in input.conf
open_list_keybind=[ ["", "copy"], ["", "recents"] ]

#--Dynamic key binding, used when the list is open to jump to a specific filter (it also allows pressing the filter key binding twice to close the list). Available filters: "all", "copy", "paste", "recents", "distinct", "protocols", "fileonly", "titleonly", "timeonly", "keywords"
list_filter_jump_keybind=[ ["c", "copy"], ["v", "paste"], ["r", "recents"], ["d", "distinct"], ["f", "fileonly"], ["p", "protocols"], ["t", "titleonly"], ["l", "playing"] ]

####------Logging settings------####

#--Specify the saving path of the bookmark log file. Change to '/:dir%script%' to place it in the same directory as the script, or to '/:dir%mpvconf%' to place it in the mpv portable_config directory
## Or use '/:var' to write any variable, then use the variable '/:var%APPDATA%'. You can also use a path, for example: '/:var%APPDATA%\mpv' or '/:var%HOME%/mpv' or specify an absolute path, for example: 'C:\Users\Eisa01\Desktop\'
log_path=/:dir%mpvconf%/files

#--Name + extension of the file that will be used to store log data
log_file=mpvClipboard.log

#--Date format in the log (see Lua date format), for example: "%d/%m/%y %X" or "%d/%b/%y %X"
date_format=%A/%B %d/%m/%Y %X

#--Select the type of media title to be saved in all, protocols, none. This option will store media titles in the log file, which is useful for websites/protocols where titles cannot be parsed from the link alone
file_title_logging=protocols

#--Add below (after the comma) any protocols you wish to have their titles stored in the log file. This only works for (file_title_logging = "protocols" or file_title_logging = "all")
logging_protocols=["://", "magnet:"]

#--Specify the range to display filenames instead of titles. Choose between local, protocols, all, and none
## "local" prefers filenames for non-protocol videos. "protocols" will only prefer filenames for protocols. "all" will always use the filename instead of the title. "none" will always use the title instead of the filename
prefer_filename_over_title=local

#--Limit saving entries with the same path: -1 means no limit, 0 will always update entries with the same path, for example, a value of 3 will limit to 3, then it will start updating the old value at the 4th entry
same_entry_limit=4

####------List settings-------####

#--Set whether to enable cursor circular scrolling
loop_through_list=yes

#--Set whether to update and display new items after reaching the middle of the list
list_middle_loader=yes

#--Show file paths instead of media titles
show_paths=no

#--Display the number of each item before displaying its name and value
show_item_number=yes

#--Set whether to slice long filenames according to the number of characters specified below
slice_longfilenames=yes

#--The number of characters used to slice long filenames
slice_longfilenames_amount=80

#--Change the maximum number to display more items in the current list
list_show_amount=10

#--Whether to enable dynamic selection key bindings, with entries from 0 to 9, for quick selection when the list is open (list_show_amount = 10 is the maximum value for this feature to work)
quickselect_0to9_keybind=yes

#--Whether to enable exiting the main list by double-clicking, even if the list is accessed through other filters
main_list_keybind_twice_exits=yes

#--Smartly set the search to be typing-free (when the search box is open) without pressing ctrl+enter
search_not_typing_smartly=yes

#--"specific" finds matches for date, title, path/URL, and time. "any" finds any typed search based on a combination of date, title, path/URL, and time. "any-notime" finds any typed search based on a combination of date, title, and path/URL, but not time (to reduce unwanted results)
search_behavior=any

####------Filter settings-------####
##--Available filters: "all" to show all items, "keybinds" to display a list filtered using keybind slots, "recents" to show recently added items without duplication, "distinct" to show recently saved entries for files in different paths, "fileonly" to show files with no saved time, "timeonly" to show files with only time, "keywords" to show files with matching keywords specified in the configuration, "playing" to show currently playing files

#--Jump to the following filters in the order shown when navigating via left and right keys. You can change the order and remove unwanted filters
filters_and_sequence=["all", "copy", "paste", "recents", "distinct", "protocols", "playing", "fileonly", "titleonly", "keywords"]

#--Key binding to jump to the next available filter based on filters_and_sequence
next_filter_sequence_keybind=["RIGHT", "MBTN_FORWARD"]

#--Key binding to jump to the previous available filter based on filters_and_sequence
previous_filter_sequence_keybind=["LEFT", "MBTN_BACK"]

#--Whether to enable looping through filters
loop_through_filters=yes

#--Create a filter for the "keywords" you want, for example: youtube.com will filter out videos on YouTube. You can also insert part of the filename or title, or the extension, or the full/part of the path. For example: ["youtube.com", "mp4", "naruto", "c:\\users\\eisa01\\desktop"]. Leave blank to disable the keyword filter
keywords_filter_list=[""]

####------Sort settings-------####
##--Available sorting: added-asc to display the latest added items first, added-desc to show the order of addition, alphanum-asc for A to Z method with filenames and episode numbers lowered first, alphanum-desc for Z to A method, time-asc or time-desc to sort the list by time

#--Specify the default sorting method for all different filters in the list. Selection range: added-asc, added-desc, time-asc, time-desc, alphanum-asc, alphanum-desc
list_default_sort=added-asc

#--Specify the default sorting for specific filters, for example: [ ["all", "alphanum-asc"], ["playing", "added-desc"] ]
list_filters_sort=[ ["keybinds", "keybind-asc"], ["fileonly", "alphanum-asc"], ["playing", "time-asc"] ]

#--Key binding for cycling through different available sortings when the list is open
list_cycle_sort_keybind=["alt+s"]

####------List design settings------####

#--Specify the alignment of the list using numeric keypad positions from 1-9, or 0 to disable. For example: 7 for top-left, 8 for top-center, 9 for top-right
list_alignment=7

#--The time type displayed for items in the list. Select: duration, length, remaining
text_time_type=duration

#--Specify the time separator style displayed before the saved time
time_seperator= 🕒 

#--Specify the style for text indicating more items above. \n for line breaks, \h for spaces
list_sliced_prefix=...\h\N

#--Specify the style for text indicating more items below
list_sliced_suffix=...

#--yes enables prefix text to display quick selection key bindings before the list, no disables
quickselect_0to9_pre_text=no

#--Specify the text color of the list, BGR hexadecimal
text_color=ffffff

#--Font size of list text
text_scale=80

#--Black border size of list text
text_border=0.5

#--Text color at the cursor position, BGR hexadecimal
text_cursor_color=ffbf7f

#--Font size of the text at the current cursor position in the list
text_cursor_scale=90

#--Black border size of the text at the current cursor position in the list
text_cursor_border=0.7

#--Prefix text for highlighted multi-select items
text_highlight_pre_text=✅ 

#--Color of the search box in typing mode
search_color_typing=ffffaa

#--Color of the search box when not in typing mode and active
search_color_not_typing=56ffaa

#--List header color, BGR hexadecimal
header_color=56ffaa

#--Font size of the list header
header_scale=100

#--Black border size of the list header
header_border=0.6

#--Text to display as the list header
#--Available header variables: %cursor%, %total%, %highlight%, %filter%, %search%, %listduration%, %listlength%, %listremaining%
#--User-defined text displayed only when variables are triggered: %prefilter%, %afterfilter%, %prehighlight%, %afterhighlight%, %presearch%, %aftersearch%, %prelistduration%, %afterlistduration%, %prelistlength%, %afterlistlength%, %prelistremaining%, %afterlistremaining%
#--Variable description: %cursor%: shows the cursor position number in the list, %total%: total items in the current list, %highlight%: total highlighted items, %filter%: shows filter name, %search%: shows typed search. User-defined text examples: %prefilter%: text before filter, %afterfilter%: text after filter
header_text=📋 Clipboard [%cursor%/%total%]%prehighlight%%highlight%%afterhighlight%%prefilter%%filter%%afterfilter%%presort%%sort%%aftersort%%presearch%%search%%aftersearch%

#--Specify the sorting method hidden from the header when using the %sort% variable
header_sort_hide_text=added-asc

#--Set text displayed before or after triggering header variables
header_sort_pre_text= \{
header_sort_after_text=}
header_filter_pre_text= [Filter: 
header_filter_after_text=]
header_search_pre_text=\h\N[Search=
header_search_after_text=..]
header_highlight_pre_text=✅
header_highlight_after_text=
header_list_duration_pre_text= 🕒 
header_list_duration_after_text=
header_list_length_pre_text= 🕒 
header_list_length_after_text=
header_list_remaining_pre_text= 🕒 
header_list_remaining_after_text=

#--Specify the style of the copy separator for copied items in the list
copy_seperator= ©

#--Specify the style of the paste separator for pasted items in the list
paste_seperator= ℗

####-----Time format settings-----####
##--In the first parameter, choose from available styles: default, hms, hms-full, timestamp, timestamp-concise. "default" displays in HH:MM:SS.sss format. "hms" displays in 1h 2m 3.4s format. "hms-full" is like hms but constant when hours and minutes are 0. "timestamp" displays total time in 123456.700 format. "timestamp-concise" displays in 123456.7 format (shows/hides decimals based on availability)
##--In the second parameter, define whether to display, round, or truncate milliseconds. Options: 'truncate' removes milliseconds and keeps seconds, 0 removes milliseconds and rounds seconds, 1 or greater specifies the number of milliseconds to display (default is 3)
##--In the third parameter, define the separator for hour:minute:second. "default" uses ":", "hms" and "hms-full" use " ". Examples: ["default", 3, "-"], ["hms-full", 5, "."], ["hms", "truncate", ":"], ["timestamp-concise"], ["timestamp"], ["timestamp", 0], ["timestamp", "truncate"], ["timestamp", 5]
copy_time_format=["timestamp-concise"]
osd_time_format=["default", "truncate"]
list_time_format=["default", "truncate"]
header_duration_time_format=["hms", "truncate", ":"]
header_length_time_format=["hms", "truncate", ":"]
header_remaining_time_format=["hms", "truncate", ":"]

####------List key binding settings------####
#--Add below (after the comma) any additional key bindings to bind, or change the letters inside quotes to modify the key binding
#--Examples: from ["b", "B"] to ["b"], from [""] to ["alt+b"], from [""] to ["a", "ctrl+a", "alt+a"]

#--Key bindings to navigate up in the list
list_move_up_keybind=["UP", "WHEEL_UP"]

#--Key bindings to navigate down in the list
list_move_down_keybind=["DOWN", "WHEEL_DOWN"]

#--Key binding to go to the first item of the displayed page
list_page_up_keybind=["PGUP"]

#--Key binding to go to the last item of the displayed page
list_page_down_keybind=["PGDWN"]

#--Key binding to navigate to the first item in the list
list_move_first_keybind=["HOME"]

#--Key binding to navigate to the last item in the list
list_move_last_keybind=["END"]

#--Key binding to highlight items when holding shift and pressing navigation keys (e.g., up, down, home, pgdwn)
list_highlight_move_keybind=["SHIFT"]

#--Key binding to highlight all displayed items in the list
list_highlight_all_keybind=["ctrl+a"]

#--Key binding to remove all currently highlighted items from the list
list_unhighlight_all_keybind=["ctrl+d"]

#--Key bindings to load entries based on cursor position
list_select_keybind=["ENTER", "MBTN_MID"]

#--Key bindings to add entries to the playlist based on cursor position
list_add_playlist_keybind=["CTRL+ENTER"]

#--Key binding to add all highlighted entries to the playlist
list_add_playlist_highlighted_keybind=["SHIFT+ENTER"]

#--Key binding to close the list (closes search first if open)
list_close_keybind=["ESC", "MBTN_RIGHT"]

#--Key binding to delete entries based on cursor position
list_delete_keybind=["DEL"]

#--Key binding to remove all highlighted entries from the list
list_delete_highlighted_keybind=["SHIFT+DEL"]

#--Key binding to trigger search
list_search_activate_keybind=["ctrl+f"]

#--Key binding to exit search typing mode while keeping search open
list_search_not_typing_mode_keybind=["ALT+ENTER"]

#--Key bindings ignored when the list is open
list_ignored_keybind=[""]
